<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AngryCoach</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="coach-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div class="brand-mark" aria-hidden="true">AC</div>
          <div>
            <p class="eyebrow">Workout command center</p>
            <h1 id="app-title">AngryCoach</h1>
          </div>
        </div>

        <div class="coach-portrait" aria-hidden="true">
          <div class="pulse-ring"></div>
          <div class="coach-face">
            <span class="brow left"></span>
            <span class="brow right"></span>
            <span class="eye left"></span>
            <span class="eye right"></span>
            <span class="mouth"></span>
          </div>
        </div>

        <p class="coach-line" id="coachLine">
          Stop negotiating with the couch. Pick a goal and move.
        </p>

        <div class="stat-grid" aria-label="Training summary">
          <article>
            <span id="minutesStat">24</span>
            <p>minutes</p>
          </article>
          <article>
            <span id="roundsStat">4</span>
            <p>rounds</p>
          </article>
          <article>
            <span id="scoreStat">82</span>
            <p>heat</p>
          </article>
        </div>
      </section>

      <section class="workspace" aria-label="Workout builder">
        <div class="toolbar">
          <div>
            <p class="eyebrow">Today</p>
            <h2>Build the session</h2>
          </div>
          <button class="icon-button" id="randomizeButton" type="button" aria-label="Randomize workout" title="Randomize workout">
            ↻
          </button>
        </div>

        <div class="control-strip" role="group" aria-label="Workout focus">
          <button class="mode-button is-active" type="button" data-focus="strength">Strength</button>
          <button class="mode-button" type="button" data-focus="cardio">Cardio</button>
          <button class="mode-button" type="button" data-focus="mobility">Mobility</button>
        </div>

        <div class="controls">
          <label>
            <span>Intensity</span>
            <input id="intensityInput" type="range" min="1" max="5" value="4" />
          </label>
          <label>
            <span>Time</span>
            <input id="timeInput" type="range" min="12" max="40" value="24" step="4" />
          </label>
        </div>

        <section class="plan" aria-labelledby="plan-title">
          <div class="section-heading">
            <h2 id="plan-title">Your orders</h2>
            <span id="difficultyBadge">Hard</span>
          </div>
          <ol id="workoutList"></ol>
        </section>

        <section class="notes" aria-labelledby="notes-title">
          <h2 id="notes-title">Coach notes</h2>
          <div class="note-list" id="noteList"></div>
        </section>
      </section>
    </main>

    <script src="src/app.js"></script>
  </body>
</html>
